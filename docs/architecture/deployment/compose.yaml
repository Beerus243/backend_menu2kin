# MODÈLE : docker compose --env-file docs/architecture/deployment/.env.example -f docs/architecture/deployment/compose.yaml up -d db redis
# API/migration profil app après intégration réelle du backend et configuration locale privée.
name: menu2kin
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: menu2kin
      POSTGRES_USER: menu2kin
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-local-demo-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menu2kin -d menu2kin"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    profiles: [app]
    build:
      context: ../../..
      dockerfile: docs/architecture/deployment/Dockerfile
      target: migration
    environment:
      DATABASE_URL: postgresql://menu2kin:${LOCAL_DB_PASSWORD:-local-demo-only}@db:5432/menu2kin
      DIRECT_DATABASE_URL: postgresql://menu2kin:${LOCAL_DB_PASSWORD:-local-demo-only}@db:5432/menu2kin
    depends_on:
      db: {condition: service_healthy}
  api:
    profiles: [app]
    build:
      context: ../../..
      dockerfile: docs/architecture/deployment/Dockerfile
      target: runtime
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://menu2kin:${LOCAL_DB_PASSWORD:-local-demo-only}@db:5432/menu2kin
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      JWT_SECRET: ${JWT_SECRET:-}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:-}
      OTP_PEPPER: ${OTP_PEPPER:-}
      SHARE_ACTOR_HASH_KEY: ${SHARE_ACTOR_HASH_KEY:-}
      ANALYTICS_HASH_KEY: ${ANALYTICS_HASH_KEY:-}
      CURSOR_SECRET: ${CURSOR_SECRET:-}
      ANONYMOUS_TOKEN_SECRET: ${ANONYMOUS_TOKEN_SECRET:-}
      DEVICE_ENCRYPTION_KEY: ${DEVICE_ENCRYPTION_KEY:-}
      DEVICE_TOKEN_HASH_KEY: ${DEVICE_TOKEN_HASH_KEY:-}
      PUBLIC_BASE_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3001
      OTP_PROVIDER: disabled
      PUSH_ENABLED: "false"
      MEDIA_ENABLED: "false"
      MEILISEARCH_ENABLED: "false"
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    profiles: [app]
    build:
      context: ../../..
      dockerfile: docs/architecture/deployment/Dockerfile
      target: runtime
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://menu2kin:${LOCAL_DB_PASSWORD:-local-demo-only}@db:5432/menu2kin
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      PUSH_ENABLED: "false"
      MEDIA_ENABLED: "false"
      OTP_PROVIDER: disabled
      MEILISEARCH_ENABLED: "false"
      SHARE_ACTOR_HASH_KEY: ${SHARE_ACTOR_HASH_KEY:-}
      ANALYTICS_HASH_KEY: ${ANALYTICS_HASH_KEY:-}
      DEVICE_ENCRYPTION_KEY: ${DEVICE_ENCRYPTION_KEY:-}
      DEVICE_TOKEN_HASH_KEY: ${DEVICE_TOKEN_HASH_KEY:-}
    healthcheck:
      disable: true # suivi heartbeat worker/queue externe, pas de sonde HTTP héritée
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  meilisearch:
    profiles: [search-v2]
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-local-demo-key-change-before-use}
      MEILI_ENV: development
    ports: ["127.0.0.1:7700:7700"]
    volumes: ["meili-data:/meili_data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  postgres-data:
  redis-data:
  meili-data:
