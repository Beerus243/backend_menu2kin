# Développement local uniquement. Ne pas réutiliser ces identifiants en production.
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: menu2kin
      POSTGRES_PASSWORD: local_development_only
      POSTGRES_DB: menu2kin
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - menu2kin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menu2kin -d menu2kin"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  menu2kin_pgdata:
